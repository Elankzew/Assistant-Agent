[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "assistant-agent"
version = "0.1.0"
description = "A modular Python assistant agent — CLI, plugins, and tooling scaffold."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Rose Agent", email = "elankyou@gmail.com" }
]
keywords = ["assistant", "agent", "automation", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
assistant-agent = "assistant_agent.cli:main"

[project.urls]
Homepage = "https://github.com/Elankzew/Assistant-Agent"
Issues = "https://github.com/Elankzew/Assistant-Agent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant_agent"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=assistant_agent --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
